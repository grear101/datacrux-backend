name: Build, Test & Deploy (Backend)

on:
  push:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # DATABASE_URL doesn't need to be a real, reachable database here -
      # `prisma generate` only reads the schema file to build the client,
      # it doesn't actually connect to anything. This is just a placeholder
      # so Prisma doesn't complain about a missing environment variable.
      - name: Build (includes prisma generate)
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
          JWT_SECRET: 'placeholder-secret-for-ci-only'

      # Only reached if both steps above succeeded - this is the actual
      # gate. RAILWAY_TOKEN should be a project-scoped token (not an
      # account-wide one), stored as a GitHub Actions secret.
      - name: Deploy to Railway
        if: success()
        run: npx @railway/cli up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
